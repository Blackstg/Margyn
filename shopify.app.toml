# Configuration de l'app Shopify publique « Steero » (organisation partenaire Steero).
# Publier une modification : npx @shopify/cli@latest app deploy
# Le secret client ne va JAMAIS ici : il est dans Vercel (SHOPIFY_CLIENT_SECRET).

client_id = "fa44ebc775345cb67f3c64b6195b593d"
name = "Steero"
application_url = "https://www.steero.io/install"
embedded = false

[access_scopes]
scopes = "read_orders,read_products,read_inventory"
# Installation gérée par Shopify (accès ci-dessus) ; il ouvre ensuite /install,
# qui obtient le jeton par autorisation OAuth (app non embarquée).

[auth]
redirect_urls = [ "https://www.steero.io/api/shopify/oauth/callback" ]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://www.steero.io/api/shopify/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://www.steero.io/api/shopify/webhooks"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
